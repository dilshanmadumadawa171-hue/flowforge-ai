<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowForge AI V3</title><style>
body{margin:0;background:#090a0f;color:#eee;font-family:Arial}*{box-sizing:border-box}.app{height:100vh;display:grid;grid-template-columns:200px 1fr 280px;grid-template-rows:1fr 160px}.left,.right,.timeline{background:#0e1016;border-color:#252731}.left{grid-row:1/3;border-right:1px solid #252731;padding:15px}.logo{font-size:19px;font-weight:bold;margin:8px}.logo b{color:#8175ff}.scene{padding:10px;margin:4px 0;border-radius:8px;background:#211e3b;font-size:12px}.thumb{display:inline-block;width:42px;height:28px;background:#39325a;border-radius:5px;vertical-align:middle;margin-right:8px}.add,.btn,.field{background:#171923;border:1px solid #30323d;color:#ddd;border-radius:8px;padding:9px}.add{width:100%;cursor:pointer}.center{padding:15px;background:#090a0f}.top{height:35px;display:flex;justify-content:space-between}.canvas{height:calc(100% - 40px);display:grid;place-items:center}.video{height:min(65vh,500px);aspect-ratio:9/16;background:radial-gradient(circle,#40375d,#11131b);border:1px solid #333;border-radius:12px;display:grid;place-items:center}.play{width:55px;height:55px;border-radius:50%;background:#766aff;display:grid;place-items:center}.right{border-left:1px solid #252731;padding:17px}.prompt{width:100%;height:130px;background:#090a0f;color:#fff;border:1px solid #30323d;border-radius:8px;padding:10px}.field{width:100%;margin-top:7px}.label{font-size:10px;color:#888;margin-top:12px}.generate{width:100%;margin-top:14px;padding:12px;background:#766aff;color:#fff;border:0;border-radius:8px;font-weight:bold}.status{font-size:10px;color:#999;margin-top:9px}.timeline{grid-column:2/4;border-top:1px solid #252731;padding:12px}.track{height:110px;background:#090a0f;border:1px solid #252731;border-radius:8px;padding:8px}.clips{display:flex;gap:7px}.clip{background:#211d36;border:1px solid #40386a;padding:9px;width:140px;border-radius:6px;font-size:10px}@media(max-width:800px){.left,.right{display:none}.app{display:block}.timeline{display:none}.center{height:100vh}}
</style></head><body><div class="app"><aside class="left"><div class="logo">Flow<b>Forge</b> AI</div><div class="scene"><span class="thumb"></span>Scene 01 · 10s</div><button class="add" onclick="addScene()">＋ Add Scene</button></aside><main class="center"><div class="top"><span>Magical Bakery / Studio</span><span>9:16</span></div><div class="canvas"><div class="video"><div class="play">▶</div></div></div></main><aside class="right"><b>AI Director</b><div class="label">PROMPT</div><textarea id="prompt" class="prompt">A tiny cinematic bakery in a magical forest, miniature bakers preparing a glowing chocolate cake, ultra realistic macro photography, warm morning light.</textarea><div class="label">DURATION</div><select id="duration" class="field"><option value="10">10 seconds</option><option value="5">5 seconds</option><option value="15">15 seconds</option></select><div class="label">ASPECT RATIO</div><select id="ratio" class="field"><option>9:16</option><option>16:9</option><option>1:1</option></select><button class="generate" onclick="generate()">✦ Generate Scene</button><div id="status" class="status">Backend: connected · Test mode</div></aside><section class="timeline"><div>Timeline</div><div class="track"><div class="clips" id="clips"><div class="clip">Scene 01 · 10s</div></div></div></section></div><script>
const API='https://flowforge-ai-xpoo.onrender.com';let n=1;
async function generate(){let s=document.getElementById('status'),p=document.getElementById('prompt').value.trim();if(!p)return;s.textContent='Sending request…';try{let r=await fetch(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,duration:+duration.value,aspectRatio:ratio.value})});let j=await r.json();if(!r.ok)throw Error(j.error);s.textContent='Job '+j.jobId+' queued…';poll(j.jobId)}catch(e){s.textContent='Error: '+e.message}}
async function poll(id){let s=document.getElementById('status');let r=await fetch(API+'/api/generate/'+id),j=await r.json();if(j.status==='completed'){s.textContent='Scene completed — TEST MODE. Real AI video comes next.';n++;let c=document.createElement('div');c.className='clip';c.textContent='Scene '+String(n).padStart(2,'0')+' · 10s';document.getElementById('clips').appendChild(c)}else{setTimeout(()=>poll(id),900)}}
function addScene(){n++;let c=document.createElement('div');c.className='clip';c.textContent='Scene '+String(n).padStart(2,'0')+' · 10s';document.getElementById('clips').appendChild(c)}
</script></body></html>
