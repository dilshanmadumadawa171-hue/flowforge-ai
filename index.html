<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowForge AI Studio</title>

<style>
body{
  margin:0;
  background:#090a0f;
  color:#eee;
  font-family:Arial,sans-serif
}
*{box-sizing:border-box}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:200px 1fr 280px;
  grid-template-rows:1fr 160px
}

.left,.right,.timeline{
  background:#0e1016;
  border-color:#252731
}

.left{
  grid-row:1/3;
  border-right:1px solid #252731;
  padding:15px
}

.logo{
  font-size:19px;
  font-weight:bold;
  margin:8px
}

.logo b{color:#8175ff}

.scene{
  padding:10px;
  margin:4px 0;
  border-radius:8px;
  background:#211e3b;
  font-size:12px
}

.thumb{
  display:inline-block;
  width:42px;
  height:28px;
  background:#39325a;
  border-radius:5px;
  vertical-align:middle;
  margin-right:8px
}

.add,.btn,.field{
  background:#171923;
  border:1px solid #30323d;
  color:#ddd;
  border-radius:8px;
  padding:9px
}

.add{
  width:100%;
  cursor:pointer
}

.center{
  padding:15px;
  background:#090a0f
}

.top{
  height:35px;
  display:flex;
  justify-content:space-between
}

.canvas{
  height:calc(100% - 40px);
  display:grid;
  place-items:center
}

.video{
  height:min(65vh,500px);
  aspect-ratio:9/16;
  background:radial-gradient(circle,#40375d,#11131b);
  border:1px solid #333;
  border-radius:12px;
  display:grid;
  place-items:center;
  overflow:hidden
}

.video video{
  width:100%;
  height:100%;
  object-fit:cover
}

.play{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#766aff;
  display:grid;
  place-items:center
}

.right{
  border-left:1px solid #252731;
  padding:17px
}

.prompt{
  width:100%;
  height:130px;
  background:#090a0f;
  color:#fff;
  border:1px solid #30323d;
  border-radius:8px;
  padding:10px
}

.field{
  width:100%;
  margin-top:7px
}

.label{
  font-size:10px;
  color:#888;
  margin-top:12px
}

.generate{
  width:100%;
  margin-top:14px;
  padding:12px;
  background:#766aff;
  color:#fff;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer
}

.generate:disabled{
  opacity:.6;
  cursor:wait
}

.status{
  font-size:10px;
  color:#aaa;
  margin-top:9px;
  line-height:1.5
}

.result{
  margin-top:12px;
  padding:10px;
  background:#11131b;
  border:1px solid #30323d;
  border-radius:8px;
  font-size:11px;
  line-height:1.5;
  max-height:180px;
  overflow:auto
}

.timeline{
  grid-column:2/4;
  border-top:1px solid #252731;
  padding:12px
}

.track{
  height:110px;
  background:#090a0f;
  border:1px solid #252731;
  border-radius:8px;
  padding:8px
}

.clips{
  display:flex;
  gap:7px;
  overflow-x:auto
}

.clip{
  background:#211d36;
  border:1px solid #40386a;
  padding:9px;
  width:140px;
  border-radius:6px;
  font-size:10px;
  flex-shrink:0
}

@media(max-width:800px){
  .left,.right{display:none}
  .app{display:block}
  .timeline{display:none}
  .center{height:100vh}
}
</style>
</head>

<body>

<div class="app">

<aside class="left">

<div class="logo">
Flow<b>Forge</b> AI
</div>

<div class="scene">
<span class="thumb"></span>
Scene 01 · 10s
</div>

<button class="add" onclick="addScene()">
＋ Add Scene
</button>

</aside>


<main class="center">

<div class="top">
<span>FlowForge AI Studio</span>
<span id="ratioTop">9:16</span>
</div>

<div class="canvas">

<div class="video" id="videoBox">

<div class="play">▶</div>

</div>

</div>

</main>


<aside class="right">

<b>AI Director</b>

<div class="label">PROMPT</div>

<textarea id="prompt" class="prompt">Create a short cinematic scene of a cute 3D cartoon bunny happily jumping in a colorful magical garden.</textarea>


<div class="label">DURATION</div>

<select id="duration" class="field">
<option value="10">10 seconds</option>
<option value="5">5 seconds</option>
<option value="15">15 seconds</option>
</select>


<div class="label">ASPECT RATIO</div>

<select id="ratio" class="field" onchange="updateRatio()">
<option value="9:16">9:16</option>
<option value="16:9">16:9</option>
<option value="1:1">1:1</option>
</select>


<button id="generateBtn" class="generate" onclick="generate()">
✦ Generate Scene
</button>


<div id="status" class="status">
Backend: connecting...
</div>


<div id="result" class="result" style="display:none"></div>

</aside>


<section class="timeline">

<div>Timeline</div>

<div class="track">

<div class="clips" id="clips">

<div class="clip">
Scene 01 · 10s
</div>

</div>

</div>

</section>

</div>


<script>

const API = 'https://flowforge-backend-42rl.onrender.com';

let n = 1;


/* Check backend */

async function checkBackend(){

  const status =
    document.getElementById('status');

  try{

    const response =
      await fetch(API + '/health');

    const data =
      await response.json();

    if(data.ok){

      status.textContent =
        'Backend: online ✓';

    }else{

      status.textContent =
        'Backend: online';

    }

  }catch(error){

    status.textContent =
      'Backend connection failed';

    console.error(error);

  }

}


/* Generate */

async function generate(){

  const status =
    document.getElementById('status');

  const result =
    document.getElementById('result');

  const button =
    document.getElementById('generateBtn');

  const prompt =
    document.getElementById('prompt')
    .value
    .trim();

  const duration =
    Number(
      document.getElementById('duration').value
    );

  const aspectRatio =
    document.getElementById('ratio').value;


  if(!prompt){

    status.textContent =
      'Please enter a prompt.';

    return;

  }


  button.disabled = true;

  result.style.display = 'none';

  status.textContent =
    'Sending request to FlowForge...';


  try{

    const response =
      await fetch(
        API + '/api/generate',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({
            prompt:prompt,
            duration:duration,
            aspectRatio:aspectRatio
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        'Generation request failed'
      );

    }


    status.textContent =
      'Job created ✓ Processing...';


    poll(data.jobId);


  }catch(error){

    console.error(error);

    status.textContent =
      'Error: ' + error.message;

    button.disabled = false;

  }

}


/* Poll job */

async function poll(jobId){

  const status =
    document.getElementById('status');

  const result =
    document.getElementById('result');

  try{

    const response =
      await fetch(
        API + '/api/generate/' + jobId
      );


    const job =
      await response.json();


    if(job.status === 'completed'){

      status.textContent =
        'Generation completed ✓';


      if(job.generatedText){

        result.style.display =
          'block';

        result.innerHTML =
          '<b>AI Result</b><br><br>' +
          escapeHtml(job.generatedText);

      }


      if(job.videoUrl){

        showVideo(job.videoUrl);

      }


      addGeneratedScene();


      document.getElementById(
        'generateBtn'
      ).disabled = false;

      return;

    }


    if(job.status === 'failed'){

      status.textContent =
        'Generation failed: ' +
        (job.error || 'Unknown error');

      document.getElementById(
        'generateBtn'
      ).disabled = false;

      return;

    }


    status.textContent =
      'AI processing...';


    setTimeout(
      () => poll(jobId),
      1000
    );


  }catch(error){

    console.error(error);

    status.textContent =
      'Checking job failed. Retrying...';

    setTimeout(
      () => poll(jobId),
      2000
    );

  }

}


/* Show real video if backend returns videoUrl */

function showVideo(url){

  const box =
    document.getElementById('videoBox');

  box.innerHTML = '';

  const video =
    document.createElement('video');

  video.src = url;

  video.controls = true;

  video.autoplay = false;

  video.playsInline = true;

  box.appendChild(video);

}


/* Add scene to timeline */

function addGeneratedScene(){

  n++;

  const duration =
    document.getElementById('duration')
    .value;

  const clip =
    document.createElement('div');

  clip.className =
    'clip';

  clip.textContent =
    'Scene ' +
    String(n).padStart(2,'0') +
    ' · ' +
    duration +
    's';

  document
    .getElementById('clips')
    .appendChild(clip);

}


/* Add empty scene */

function addScene(){

  n++;

  const clip =
    document.createElement('div');

  clip.className =
    'clip';

  clip.textContent =
    'Scene ' +
    String(n).padStart(2,'0') +
    ' · 10s';

  document
    .getElementById('clips')
    .appendChild(clip);

}


/* Ratio display */

function updateRatio(){

  document.getElementById(
    'ratioTop'
  ).textContent =
    document.getElementById(
      'ratio'
    ).value;

}


/* Safe text */

function escapeHtml(text){

  return text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>');

}


/* Start */

checkBackend();

</script>

</body>
</html>
