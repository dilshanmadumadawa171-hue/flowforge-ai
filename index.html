<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowForge AI Studio</title><style>body{margin:0;background:#090a0f;color:#fff;font-family:Arial;text-align:center}.box{max-width:700px;margin:8vh auto;padding:30px}.card{background:#12141c;border:1px solid #30323d;border-radius:14px;padding:25px}.btn{background:#766aff;color:white;border:0;border-radius:8px;padding:12px 20px;font-weight:bold}.prompt{width:90%;height:110px;background:#08090d;color:#fff;border:1px solid #30323d;border-radius:8px;padding:10px}</style></head><body><div class="box"><h1>FlowForge <span style="color:#8175ff">AI Studio</span></h1><div class="card"><h2>AI Director</h2><p>Describe your scene</p><textarea id="p" class="prompt">A cinematic miniature bakery in a magical forest, ultra realistic macro photography.</textarea><br><button class="btn" onclick="go()">✦ Generate Scene</button><p id="s">Backend: connected · Test mode</p></div></div><script>const API='https://flowforge-ai-xpoo.onrender.com';async function go(){let s=document.getElementById('s');s.textContent='Sending request…';try{let r=await fetch(API+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('p').value,duration:10,aspectRatio:'9:16'})});let j=await r.json();s.textContent=r.ok?'Job '+j.jobId+' created · Test mode':'Error: '+(j.error||'request failed')}catch(e){s.textContent='Connection error: '+e.message}}</script></body></html>
